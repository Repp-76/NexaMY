<style>
:root{--bg:#05070B;--bg2:#0A1018;--card:#101824;--el:#151F2D;--blue:#2583FF;--cyan:#39D5FF;--tx:#F5F8FF;--tx2:#9BA9BD;--bd:#243247;--ok:#4ade80;--err:#ff6b6b}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 "Segoe UI",system-ui,Roboto,sans-serif;overflow-x:hidden}
body.lock{overflow:hidden}
a{color:var(--cyan)}
h1,h2,h3{line-height:1.25;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(1.9rem,6vw,3rem)}h2{font-size:1.5rem}h3{font-size:1.1rem}
p{margin:0 0 1em}
#app>p,#app>ol{max-width:68ch}
#app>h3{margin-top:1.6em}
#app>h2{margin-top:1.4em}
#app>h1+h2{margin-top:.8em}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--bd)}
.bar{max-width:1100px;margin:auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.brand{font-weight:700;font-size:1.1rem;color:var(--tx);text-decoration:none;display:flex;gap:8px;align-items:center}
.brand b{color:var(--cyan)}
nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
nav a{color:var(--tx2);text-decoration:none;padding:8px 11px;border-radius:6px;font-size:.92rem}
nav a:hover,nav a.on{color:var(--tx);background:var(--el)}
#menu{display:none;margin-left:auto}
main{max-width:1100px;margin:auto;padding:24px 16px 60px;min-height:70vh}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--el);color:var(--tx);border:1px solid var(--bd);padding:10px 16px;border-radius:6px;font:inherit;font-size:.92rem;cursor:pointer;text-decoration:none;min-height:42px}
.btn:hover{border-color:var(--blue);background:#1b2840}
.btn:active{background:#0f1826}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.btn.p:hover{background:#3a91ff}
.btn.p:active{background:#1f73e6}
.btn.s{padding:6px 10px;min-height:34px;font-size:.85rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:16px}
a.card{display:block;color:var(--tx);text-decoration:none}
a.card:hover{border-color:var(--blue)}
.muted{color:var(--tx2)}
.tag{display:inline-block;font-size:.78rem;padding:2px 8px;border:1px solid var(--bd);border-radius:4px;color:var(--tx2)}
.hero{padding:36px 0 28px;border-bottom:1px solid var(--bd);margin-bottom:28px}
.hero p{max-width:560px;color:var(--tx2)}
.bar2{height:6px;background:var(--el);border-radius:3px;overflow:hidden;margin:8px 0}
.bar2 i{display:block;height:100%;background:var(--blue)}
section.blk{margin-top:34px}
.ed{border:1px solid var(--bd);border-radius:8px;background:#070B11;overflow:hidden;margin:12px 0}
.ed.full{position:fixed;inset:0;z-index:40;border-radius:0;margin:0;display:flex;flex-direction:column}
.edbar{display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:var(--bg2);border-bottom:1px solid var(--bd)}
.edwrap{display:flex;font:13.5px/1.55 ui-monospace,Menlo,Consolas,monospace;min-height:200px;max-height:380px;flex:1}
.ed.full .edwrap{max-height:none}
.gut{padding:10px 8px;text-align:right;color:#4b5b72;background:var(--bg2);overflow:hidden;user-select:none;white-space:pre}
.edwrap textarea{flex:1;background:transparent;color:var(--tx);border:0;resize:none;padding:10px;font:inherit;white-space:pre;overflow:auto;tab-size:2}
.edwrap textarea:focus{outline:none}
.out{margin:0;padding:12px;background:#03050A;border-top:1px solid var(--bd);font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word;min-height:56px;max-height:260px;overflow:auto}
.out.err{color:var(--err)}
.st{font-size:.8rem;color:var(--tx2);padding:6px 12px;border-top:1px solid var(--bd)}
iframe.pv{width:100%;height:260px;border:0;border-top:1px solid var(--bd);background:#fff}
pre.code{background:#070B11;border:1px solid var(--bd);border-radius:6px;padding:12px;overflow-x:auto;font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;margin:8px 0}
code{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--cyan);font-size:.92em}
pre code{color:var(--tx)}
.warn{border-left:3px solid #f5b83d;background:rgba(245,184,61,.08);padding:8px 12px;font-size:.9rem;margin:8px 0}
input[type=search],select,input[type=number]{max-width:100%;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:10px;font:inherit;min-height:42px}
input[type=search]{flex:1;min-width:160px}
details{margin:8px 0}summary{cursor:pointer;color:var(--cyan);padding:6px 0}
footer{border-top:1px solid var(--bd);padding:24px 16px;text-align:center;color:var(--tx2);font-size:.9rem}
#note{position:fixed;top:68px;right:14px;z-index:50;max-width:320px;display:flex;align-items:flex-start;gap:10px;background:var(--bg2);border:1px solid rgba(57,213,255,.35);box-shadow:0 4px 14px rgba(0,0,0,.4);border-radius:8px;padding:10px 12px;cursor:pointer;animation:in .35s ease-out;font-size:.9rem}
#note span{flex:1;text-align:left}
#note button{background:none;border:0;color:var(--tx2);cursor:pointer;padding:2px;margin:-2px}
#note[hidden]{display:none}
@keyframes in{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
#ov{position:fixed;inset:0;z-index:60;background:rgba(2,4,8,.8);display:flex;align-items:center;justify-content:center;padding:16px}
#ov[hidden]{display:none}
.dlg{background:var(--bg2);border:1px solid rgba(57,213,255,.35);box-shadow:0 8px 28px rgba(0,0,0,.5);border-radius:8px;width:100%;max-width:460px;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:auto;padding:20px;position:relative}
.dlg .x{position:absolute;top:10px;right:10px;background:none;border:0;color:var(--tx2);cursor:pointer;padding:6px}
.ch{display:flex;gap:14px;align-items:center;padding:14px;margin-top:10px;background:var(--card);border:1px solid var(--bd);border-radius:8px;color:var(--tx);text-decoration:none}
.ch:hover{border-color:var(--cyan)}
.ch svg.lg{width:40px;height:40px;flex:none}
.ch small{display:block;color:var(--tx2)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--el);border:1px solid var(--blue);padding:8px 16px;border-radius:6px;z-index:70;font-size:.9rem}
#toast[hidden]{display:none}
@media(max-width:760px){
nav{display:none;position:absolute;top:100%;left:0;right:0;background:var(--bg2);flex-direction:column;padding:8px;border-bottom:1px solid var(--bd)}
nav.open{display:flex}#menu{display:inline-flex}
nav a{padding:12px}
.btn.s{min-height:40px}
main{padding-top:20px}
#note{top:62px;right:8px;left:8px;max-width:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
/* ---- design tokens and shared refinements (additive) ---- */
:root{--r:8px;--r-sm:6px;--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px}
input[type=checkbox],input[type=range]{accent-color:var(--blue)}
.btn{transition:background-color .15s,border-color .15s}
.btn:disabled{opacity:.5;cursor:not-allowed}
.edwrap,.edwrap textarea{min-width:0}
.ed{max-width:100%}
@media(max-width:760px){nav{max-height:calc(100vh - 64px);max-height:calc(100dvh - 64px);overflow:auto}}
@media(prefers-reduced-motion:reduce){.btn{transition:none}}

/* ---- developer tools (namespaced .tl-) ---- */
.tl-bar{margin:16px 0 20px;align-items:center}
.tl-chips{display:flex;flex-wrap:wrap;gap:6px}
.tl-chips .btn[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.tl-card{display:flex;gap:12px;align-items:flex-start}
.tl-card b{display:block;margin-bottom:2px}
.tl-card small{line-height:1.4}
.tl-ic{display:inline-flex;padding:8px;border:1px solid var(--bd);border-radius:6px;color:var(--cyan);background:var(--bg2)}
.tl{max-width:760px}
.tl-in{width:100%;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:10px;font:inherit;min-height:42px}
textarea.tl-in{font:13.5px/1.55 ui-monospace,Menlo,Consolas,monospace;resize:vertical;white-space:pre;overflow:auto;tab-size:2}
.tl-f{margin:0 0 14px}
.tl-f label{display:block;font-size:.88rem;color:var(--tx2);margin-bottom:6px}
.tl-row{margin:0 0 14px;align-items:flex-end}
.tl-row .tl-f{margin:0;flex:1;min-width:140px}
.tl-out{border:1px solid var(--bd);border-radius:6px;margin:0 0 14px;min-height:56px}
.tl-out:empty::before{content:"Output appears here.";color:var(--tx2)}
.tl-st{margin:0 0 10px;font-size:.88rem}
.tl-chk{display:inline-flex;gap:8px;align-items:center;min-height:42px;margin-right:8px;font-size:.92rem}
.tl-range{width:100%}
.tl-color{width:56px;height:42px;padding:2px;background:var(--card);border:1px solid var(--bd);border-radius:6px}
.tl-sw{height:56px;border:1px solid var(--bd);border-radius:6px;margin:0 0 14px}
.tl-prev{display:grid;place-items:center;min-height:130px;background:#dfe6f1;border-radius:6px;margin:0 0 14px;padding:16px}
.tl-pbox{width:90px;height:90px;background:#fff}
.tl-cprev{text-align:center;border:1px solid var(--bd)}
.tl-cprev p{margin:4px 0 0}
.tl-ln{display:block;white-space:pre-wrap;word-break:break-word}
.tl-add{color:var(--ok)}
.tl-del{color:var(--err)}
.tl-md{border:1px solid var(--bd);border-radius:8px;background:var(--card);padding:4px 16px 8px;overflow-wrap:anywhere}
.tl-md h1{font-size:1.5rem}.tl-md h2{font-size:1.25rem}.tl-md h3,.tl-md h4,.tl-md h5,.tl-md h6{font-size:1.05rem}
.tl-md blockquote{margin:0 0 1em;padding:2px 12px;border-left:3px solid var(--blue);color:var(--tx2)}
.tl-md hr{border:0;border-top:1px solid var(--bd)}
.tl-md pre.code{margin:0 0 1em}
.tl-item{border:1px solid var(--bd);border-radius:8px;background:var(--card);padding:12px;margin-bottom:10px}
.tl-itemhead{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}
.tl-itemhead strong{overflow-wrap:anywhere}
.tl-item .tl-row{margin:0}
.tl-todo{list-style:none;margin:0 0 14px;padding:0}
.tl-todo li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.tl-todo label{display:flex;gap:10px;align-items:center;flex:1;min-width:0;min-height:36px;overflow-wrap:anywhere}
.tl-todo li.done span{color:var(--tx2);text-decoration:line-through}
.tl-prog{margin-top:14px}
.tl .btn:disabled{opacity:.5;cursor:not-allowed}
.tl-gprev{height:140px;border:1px solid var(--bd);border-radius:6px;margin:0 0 14px}
.tl-fbox,.tl-gbox{overflow:auto;border:1px dashed var(--bd);border-radius:6px;background:var(--bg2);padding:8px;margin:0 0 14px}
.tl-fbox{height:220px}
.tl-fbox>div,.tl-gbox>div{background:var(--blue);color:#fff;border-radius:4px;padding:10px 14px;text-align:center;min-width:36px}
.tl-pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin:0 0 14px}
.tl-pal button{min-height:64px;border:1px solid var(--bd);border-radius:6px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;cursor:pointer;padding:6px}
.tl-perm{display:flex;flex-wrap:wrap;gap:8px 28px;margin:0 0 10px}
.tl-permcol{display:flex;flex-direction:column}
.tl-img{display:block;max-width:100%;max-height:240px;border:1px solid var(--bd);border-radius:6px;background:var(--bg2);margin:0 0 14px}
.tl-ftxt{border:1px solid var(--bd);border-radius:6px;padding:12px;margin:0 0 14px;overflow-wrap:anywhere}
</style>
</head>
